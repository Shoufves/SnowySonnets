<header class="site-header">
  <nav class="site-nav" aria-label="主导航">
    <a class="brand" href="{{ site.Home.RelPermalink }}">SnowySonnets</a>
    <button class="nav-toggle" id="nav-toggle" type="button" aria-label="打开菜单" aria-expanded="false" aria-controls="nav-links">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="nav-links">
      <li><a href="{{ site.Home.RelPermalink }}">首页</a></li>
      <li><a href="{{ (site.GetPage "/posts").RelPermalink }}">文章库</a></li>
      {{ with site.GetPage "/categories" }}<li><a href="{{ .RelPermalink }}">分类</a></li>{{ end }}
      {{ with site.GetPage "/tags" }}<li><a href="{{ .RelPermalink }}">标签</a></li>{{ end }}
      {{ with site.GetPage "/search" }}<li><a href="{{ .RelPermalink }}">搜索</a></li>{{ end }}
      {{ with site.GetPage "/about" }}<li><a href="{{ .RelPermalink }}">关于</a></li>{{ end }}
    </ul>
  </nav>
</header>
