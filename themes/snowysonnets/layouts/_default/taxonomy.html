{{ define "main" }}
<section class="page paper-panel">
  <button class="back-btn" type="button" onclick="history.back()">← 返回</button>
  <h1>{{ .Title }}</h1>
  <ul class="article-list">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
